
<html>

<head>
    <title>Simple To-Do List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class = "card p-4 mt-4">
        <h1 class = "text-center"> Task List Manager</h1>

        <form id="taskForm" class ="mb-4">
            <label>Enter the name of your task:</label>
            <input id="taskTitle" autocomplete="off" autofocus placeholder="Task Title"><br><br>

            <label>Task Priority:</label>
            <select id="taskPriority">
                <option value="Low">Low</option>
                <option value="Medium">Medium</option>
                <option value="High">High</option>
            </select><br><br>

            <label>Task Status:</label>
            <input type="radio" id="pending" name="taskStatus" value="Pending" checked>
            <label for="pending">Pending</label>
            <input type="radio" id="completed" name="taskStatus" value="Completed">
            <label for="completed">Completed</label><br><br>

            <input id="submit" type="submit" value="Add Task">
        </form>

        <h2>Task List</h2>
        <ul id="taskList" class = "list-group"></ul>
    </div>

    <script src="script.js"></script>
</body>

</html>
